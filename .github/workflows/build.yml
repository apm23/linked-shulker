name: build-linked-shulker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version
      - name: Probe Container API
        run: |
          gradle -q writeCompileClasspath
          CP="$(cat build/compile-classpath.txt)"
          echo '=== net.minecraft.world.Container ==='
          javap -classpath "$CP" net.minecraft.world.Container || true
          echo '=== classes containing ContainerOpenersCounter/open hooks ==='
          for C in net.minecraft.world.level.block.entity.ContainerOpenersCounter net.minecraft.world.level.block.entity.BaseContainerBlockEntity net.minecraft.world.level.block.entity.ChestBlockEntity; do
            echo "--- $C ---"
            javap -classpath "$CP" "$C" || true
          done
      - name: Build
        run: gradle clean build --stacktrace
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: linked-shulker-build
          path: build/libs/*.jar
